name: CI
on: [push, pull_request]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # changeset status diffs against the merge base with origin/main, which a
                  # shallow clone does not have.
                  fetch-depth: 0
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.x
                  cache: pnpm
            - name: Install deps
              run: pnpm install --frozen-lockfile
            - name: ESLint
              run: pnpm run ci:lint
            - name: Typecheck
              run: pnpm run ci:typecheck
            - name: Prettier
              run: pnpm run ci:fmt
            - name: Build
              run: pnpm run ci:build
            # Skipped for dependabot's own pushes; a maintainer commit on its PR (adding a changeset) runs it again.
            - name: Changesets
              if: github.head_ref != 'changeset-release/main' && github.ref != 'refs/heads/changeset-release/main' && github.actor != 'dependabot[bot]'
              run: pnpm run ci:changesets

    test:
        needs: [lint]
        strategy:
            matrix:
                node-version: [22.x, 24.x, 26.x]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm
            - name: Install deps
              run: pnpm install --frozen-lockfile
            - name: Tests
              run: pnpm run ci:tests
