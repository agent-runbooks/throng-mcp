name: Release

on:
    push:
        branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        name: Release
        # prevents this action from running on forks
        if: github.repository == 'agent-runbooks/throng-mcp'
        permissions:
            contents: write # to create release
            issues: write # to post issue comments
            pull-requests: write # to create pull request
            id-token: write # to mint the OIDC token npm exchanges for publish rights
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.x
                  cache: pnpm
            - name: Install deps
              run: pnpm install --frozen-lockfile
            - name: Create Release Pull Request or Publish to npm
              id: changesets
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  pr-title: 'Upcoming Release'
                  commit-message: 'chore(release): version bump'
                  publish-script: pnpm run ci:publish
                  version-script: pnpm run ci:version
            # Needs id-token: write above: mcp-publisher logs in by OIDC, which also covers the org namespace.
            # Runs on every push and publishes only a server.json version the registry lacks, so a job rerun finishes a failed listing.
            # Retries for up to 10 minutes: the registry checks npm and sees a fresh version only after a delay (90 s on 0.9.0).
            # The binary runs with this job's OIDC, which npm trusts for publishing, so the tarball is pinned by its sha256
            # from registry_1.8.1_checksums.txt.
            - name: Publish to the MCP Registry
              run: |
                  name=$(jq -r .name server.json)
                  version=$(jq -r .version server.json)
                  if curl -fsS -o /dev/null "https://registry.modelcontextprotocol.io/v0/servers/${name//\//%2F}/versions/$version"; then
                      echo "$name $version is already in the registry"
                      exit 0
                  fi
                  curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
                  echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
                  tar xzf mcp-publisher.tar.gz mcp-publisher
                  ./mcp-publisher login github-oidc
                  for _ in $(seq 20); do
                      ./mcp-publisher publish && exit 0
                      sleep 30
                  done
                  exit 1
